<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REFORM - Upcycled Clothing</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Neue Haas Grotesk"', 'Helvetica', 'ui-sans-serif', 'system-ui']
          }
        }
      }
    }
  </script>

  <!-- Custom Fonts -->
  <link rel="stylesheet" href="/fonts/fonts.css">

  <!-- Optional main CSS for extra styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white min-h-screen" style="font-family: 'Neue Haas Grotesk', Helvetica, sans-serif">

  <!-- Main Grid Container -->
   <main class="min-h-screen grid grid-cols-12 grid-rows-12 gap-4 p-6">

    <!-- TOP LEFT: Navigation -->
    <section class="col-span-4 row-span-2 border-2 border-black"> 
      <p class="p-4"> Navigation</p>
    </section>
    
    <!-- TOP RIGHT: Icon and Stats -->
     <section class="col-span-8 row-span-2 border-2 border-black">
      <p class="p-4"> Icons / Stats</p>
     </section>

     <!-- Center: Hero pic -->
     <section class="col-span-12 row-span-6 border-2 border-black">
      <p class="p-4 text-center"> Hero Image</p>
     </section>

    <!-- BOTTOM LEFT: Feature Box -->
    <section class="col-span-6 row-span-4 border-2 border-black">
      <p class="p-4 text-center"> Featured</p>
    </section>


    <!-- BOTTOM RIGHT: Extra Images -->
    <section class="col-span-6 row-span-4 border-2 border-black">
      <p class="p-4 text-center"> Extra Images</p>
    </section>

  
   </main>
</body>
</html>
